<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevTask Pro - Smart Productivity Dashboard</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="styles.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          },
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans min-h-screen transition-colors duration-300">

  <!-- Header / Navigation -->
  <header class="sticky top-0 z-30 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-4 lg:px-8 py-4">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-indigo-500/30">
          <i class="fa-solid fa-check-double"></i>
        </div>
        <div>
          <h1 class="font-bold text-xl leading-none text-slate-900 dark:text-white">DevTask <span class="text-indigo-600 dark:text-indigo-400">Pro</span></h1>
          <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Productivity & Task Dashboard</p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <button id="themeToggle" class="w-10 h-10 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition">
          <i class="fa-solid fa-moon dark:hidden"></i>
          <i class="fa-solid fa-sun hidden dark:block text-amber-400"></i>
        </button>
        <button id="openTaskModal" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl shadow-lg shadow-indigo-600/25 flex items-center gap-2 transition transform active:scale-95 text-sm">
          <i class="fa-solid fa-plus"></i> New Task
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 lg:px-8 py-8">
    <!-- Stats Overview Section -->
    <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
      <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Tasks</p>
          <h3 id="statTotal" class="text-2xl font-bold mt-1">0</h3>
        </div>
        <div class="w-12 h-12 rounded-xl bg-blue-50 dark:bg-blue-950/50 text-blue-600 dark:text-blue-400 flex items-center justify-center text-lg">
          <i class="fa-solid fa-list-check"></i>
        </div>
      </div>

      <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Pending Tasks</p>
          <h3 id="statPending" class="text-2xl font-bold mt-1">0</h3>
        </div>
        <div class="w-12 h-12 rounded-xl bg-amber-50 dark:bg-amber-950/50 text-amber-600 dark:text-amber-400 flex items-center justify-center text-lg">
          <i class="fa-regular fa-clock"></i>
        </div>
      </div>

      <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Completed Tasks</p>
          <h3 id="statCompleted" class="text-2xl font-bold mt-1">0</h3>
        </div>
        <div class="w-12 h-12 rounded-xl bg-emerald-50 dark:bg-emerald-950/50 text-emerald-600 dark:text-emerald-400 flex items-center justify-center text-lg">
          <i class="fa-regular fa-circle-check"></i>
        </div>
      </div>

      <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-sm flex flex-col justify-between">
        <div class="flex items-center justify-between mb-2">
          <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Completion Rate</p>
          <span id="statRate" class="text-xs font-bold text-indigo-600 dark:text-indigo-400">0%</span>
        </div>
        <div class="w-full bg-slate-100 dark:bg-slate-800 h-2.5 rounded-full overflow-hidden">
          <div id="progressBar" class="bg-indigo-600 h-full rounded-full transition-all duration-500 w-0"></div>
        </div>
      </div>
    </section>

    <!-- Controls & Filters Section -->
    <section class="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-sm mb-6 flex flex-col md:flex-row gap-4 justify-between items-center">
      <!-- Search Input -->
      <div class="relative w-full md:w-80">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
        <input type="text" id="searchInput" placeholder="Search tasks..." class="w-full pl-10 pr-4 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
      </div>

      <!-- Filters & Sorting -->
      <div class="flex flex-wrap items-center gap-3 w-full md:w-auto justify-between md:justify-end">
        <!-- Status Tabs -->
        <div class="flex bg-slate-100 dark:bg-slate-800 p-1 rounded-xl text-xs font-medium">
          <button data-filter="all" class="filter-tab px-3 py-1.5 rounded-lg transition active-tab">All</button>
          <button data-filter="pending" class="filter-tab px-3 py-1.5 rounded-lg text-slate-500 dark:text-slate-400 transition">Pending</button>
          <button data-filter="completed" class="filter-tab px-3 py-1.5 rounded-lg text-slate-500 dark:text-slate-400 transition">Completed</button>
        </div>

        <!-- Priority Select -->
        <select id="priorityFilter" class="px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="all">All Priorities</option>
          <option value="high">High Priority</option>
          <option value="medium">Medium Priority</option>
          <option value="low">Low Priority</option>
        </select>
      </div>
    </section>

    <!-- Task List Grid -->
    <section id="taskList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></section>

    <!-- Empty State -->
    <div id="emptyState" class="hidden flex-col items-center justify-center py-16 text-center">
      <div class="w-20 h-20 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-400 text-3xl mb-4">
        <i class="fa-solid fa-folder-open"></i>
      </div>
      <h3 class="font-semibold text-lg text-slate-700 dark:text-slate-300">No tasks found</h3>
      <p class="text-sm text-slate-400 mt-1 max-w-sm">Create a new task to get started or adjust your active filters.</p>
    </div>
  </main>

  <!-- Create/Edit Task Modal -->
  <div id="taskModal" class="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-900 rounded-2xl max-w-md w-full border border-slate-200 dark:border-slate-800 shadow-2xl p-6 transition-all scale-95 opacity-0 modal-box">
      <div class="flex justify-between items-center mb-5">
        <h3 id="modalTitle" class="text-lg font-bold">Create New Task</h3>
        <button id="closeModal" class="w-8 h-8 rounded-lg text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center justify-center">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form id="taskForm" class="space-y-4">
        <input type="hidden" id="taskId">
        
        <div>
          <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase mb-1">Task Title *</label>
          <input type="text" id="taskTitleInput" required placeholder="e.g. Implement Authentication" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase mb-1">Description</label>
          <textarea id="taskDescInput" rows="3" placeholder="Add task details..." class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none"></textarea>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase mb-1">Priority</label>
            <select id="taskPriorityInput" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase mb-1">Category</label>
            <select id="taskCategoryInput" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="Feature">Feature</option>
              <option value="Bugfix">Bugfix</option>
              <option value="Design">Design</option>
              <option value="Refactor">Refactor</option>
            </select>
          </div>
        </div>

        <div class="flex justify-end gap-3 pt-4 border-t border-slate-100 dark:border-slate-800">
          <button type="button" id="cancelModal" class="px-4 py-2 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-semibold hover:bg-slate-100 dark:hover:bg-slate-800">Cancel</button>
          <button type="submit" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-xs shadow-lg shadow-indigo-600/20">Save Task</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2"></div>

  <!-- Custom JavaScript -->
  <script src="script.js"></script>
</body>
</html>
